<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Matching Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
        .box { width: 200px; height: 200px; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: 20px; margin: 10px; position: relative; }
        .word-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
        .word { padding: 12px; font-size: 18px; background-color: lightgray; cursor: grab; border-radius: 5px; transition: transform 0.3s ease-in-out; }
        .word:active { transform: scale(1.1); }
        .dropArea { border: 2px dashed #666; width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: background-color 0.3s ease-in-out; }
        .dropArea.correct { background-color: rgba(0, 255, 0, 0.5); }
        .dropArea.wrong { background-color: rgba(255, 0, 0, 0.5); }
        #timer, #score { font-size: 20px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
<h1>Colour Matching Game</h1>
    <p>Drag the colour name to the correct coloured box before time runs out!</p>
    <div id="timer">Time left: <span id="timeLeft">60</span> sec</div>
    <div id="score">Score: <span id="scoreCount">0</span></div>

    <audio id="correctSound" src="correct.OGG"></audio>
    <audio id="wrongSound" src="wrong.OGG"></audio>

    <div class="container">
        <div class="box" style="background-color: red;"><div class="dropArea" ondrop="drop(event, 'red')" ondragover="allowDrop(event)"></div></div>
        <div class="box" style="background-color: blue;"><div class="dropArea" ondrop="drop(event, 'blue')" ondragover="allowDrop(event)"></div></div>
        <div class="box" style="background-color: yellow;"><div class="dropArea" ondrop="drop(event, 'yellow')" ondragover="allowDrop(event)"></div></div>
        <div class="box" style="background-color: green;"><div class="dropArea" ondrop="drop(event, 'green')" ondragover="allowDrop(event)"></div></div>
        <div class="box" style="background-color: orange;"><div class="dropArea" ondrop="drop(event, 'orange')" ondragover="allowDrop(event)"></div></div>
        <div class="box" style="background-color: purple;"><div class="dropArea" ondrop="drop(event, 'purple')" ondragover="allowDrop(event)"></div></div>
        <div class="box" style="background-color: pink;"><div class="dropArea" ondrop="drop(event, 'pink')" ondragover="allowDrop(event)"></div></div>
    </div>

    <div class="word-container">
        <div class="word" draggable="true" id="red" ondragstart="drag(event)">Red</div>
        <div class="word" draggable="true" id="blue" ondragstart="drag(event)">Blue</div>
        <div class="word" draggable="true" id="yellow" ondragstart="drag(event)">Yellow</div>
        <div class="word" draggable="true" id="green" ondragstart="drag(event)">Green</div>
        <div class="word" draggable="true" id="orange" ondragstart="drag(event)">Orange</div>
        <div class="word" draggable="true" id="purple" ondragstart="drag(event)">Purple</div>
        <div class="word" draggable="true" id="pink" ondragstart="drag(event)">Pink</div>
    </div>

    <script>
        let score = 0;
        let timeLeft = 60;
        
        function allowDrop(event) { event.preventDefault(); }
        
        function drag(event) { event.dataTransfer.setData("text", event.target.id); }
        
        function drop(event, correctAnswer) {
            event.preventDefault();
            let wordId = event.dataTransfer.getData("text");
            let draggedWord = document.getElementById(wordId);
            let dropArea = event.target;
            
            dropArea.innerText = draggedWord.innerText;
            
            if (draggedWord.id === correctAnswer) {
                document.getElementById("correctSound").play();
                dropArea.classList.add("correct");
                score++;
                document.getElementById("scoreCount").innerText = score;
                setTimeout(() => dropArea.classList.remove("correct"), 1000);
            } else {
                document.getElementById("wrongSound").play();
                dropArea.classList.add("wrong");
                setTimeout(() => { dropArea.innerText = ""; dropArea.classList.remove("wrong"); }, 1000);
            }
        }

        function countdown() {
            let timer = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    document.getElementById("timeLeft").innerText = timeLeft;
                } else {
                    clearInterval(timer);
                    alert("Time’s up! Final Score: " + score);
                }
            }, 1000);
        }

        countdown();
    </script>
</body>
</html>
